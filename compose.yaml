services:
  py_app:
    image: fancydogge/devopsimsya-py:latest
    ports:
      - "6969:8080"
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  js_app:
    image: fancydogge/devopsimsya-js:latest
    ports:
      - "1337:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge