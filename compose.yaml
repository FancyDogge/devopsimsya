services:
  # единая точка входа на 1337, в py и js убрал проброс портов
  gateway:
    image: nginx:alpine
    restart: always
    ports:
      - "1337:80"
    volumes:
      - ./conf/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - py_app
      - js_app
    networks:
      - app_network

  py_app:
    image: fancydogge/devopsimsya-py:latest
    restart: always
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  js_app:
    image: fancydogge/devopsimsya-js:latest
    restart: always
    environment:
      - PORT=3000
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  redis_data:

networks:
  app_network:
    driver: bridge