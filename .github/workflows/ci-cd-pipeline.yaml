name: CI/CD Pipeline
# Общий пайплайн, потому что косяк с очередностью запуска был: они одновременно стартовали

on:
  # push:
  #   branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Настройка хоста через Ansible
  ansible-setup:
    runs-on: ubuntu-latest

    env:
      HOST: ${{ secrets.VPS_IP }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      ANSIBLE_REMOTE_USER: ${{ vars.VPS_USER }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up latest Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: pip install ansible

      - name: Configure SSH Key and Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Generate Dynamic Inventory
        working-directory: ./ansible
        run: |
          echo "[vps]" > inventory.ini
          echo "my_vps ansible_host=$HOST ansible_user=$ANSIBLE_REMOTE_USER" >> inventory.ini

      - name: Check Ansible Connectivity
        working-directory: ./ansible
        run: ansible vps -m ping

      - name: Install Ansible Galaxy Roles
        working-directory: ./ansible
        run: ansible-galaxy install -r requirements.yml

      - name: Setup Docker Engine on VPS
        working-directory: ./ansible
        run: ansible-playbook setup-docker.yaml

  # Сборка и пуш Docker-образов
  build-and-push:
    needs: ansible-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Python App
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./py_app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devopsimsya-py:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devopsimsya-py:${{ github.sha }}

      - name: Build & Push Node.js App
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./js_app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devopsimsya-js:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devopsimsya-js:${{ github.sha }}

  # Деплой контейнеров на VPS
  docker-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Copy Compose and Nginx configs to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yaml,conf/nginx-gateway.conf"
          target: "/opt/devopsimsya"

      - name: Deploy containers on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/devopsimsya
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f