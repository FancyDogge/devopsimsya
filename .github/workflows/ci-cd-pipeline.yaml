name: CI/CD Pipeline
#Т. к. очередность выполнения сломана была, все в один файл пошло

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # Настройка хоста через Ansible
  setup-host:
    name: Setup Host via Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts

      - name: Install Ansible and requirements
        run: |
          pipx install --include-deps ansible
          ansible-galaxy install -r ansible/requirements.yaml

      - name: Generate Dynamic Inventory
        run: |
          echo "[vps]" > ansible/inventory.ini
          echo "${{ secrets.VPS_IP }} ansible_user=${{ vars.VPS_USER }} ansible_ssh_private_key_file=~/.ssh/id_ed25519" >> ansible/inventory.ini

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/setup-docker.yaml

  # Сборка и деплой Docker 
  build-and-deploy:
    name: Build, Push & Deploy Docker
    needs: [setup-host] # ждет успешного завершения Ansible джобы сверху
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Python App
        uses: docker/build-push-action@v6
        with:
          context: ./py_app
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devopsimsya-py:latest

      - name: Build and Push Node.js App
        uses: docker/build-push-action@v6
        with:
          context: ./js_app
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devopsimsya-js:latest

      - name: Copy Compose and Configs to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yaml,conf/nginx-gateway.conf"
          target: "/opt/devopsimsya"
          strip_components: 0

      - name: Deploy containers on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/devopsimsya
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f