---
- name: Deploy Node.js app via systemd and nginx
  hosts: vps
  become: true

  vars:
    app_user: "{{ ansible_user }}"
    app_dir: "/home/{{ app_user }}/app/devopsimsya/js_app"

  tasks:
    # 1. Установка системных зависимостей
    - name: Install required system packages
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
          - rsync #расписал в python плейбуке
          - nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    # 2. Создание структуры директорий
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'
      loop: # по луп обильный коммент в python плейбуке
        - "/home/{{ app_user }}/app/devopsimsya"
        - "{{ app_dir }}"

    # 3. Синхронизация кода и package.json
    - name: Synchronize Node.js application files
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../js_app/"
        dest: "{{ app_dir }}/"
        recursive: true
        delete: true
        rsync_opts:
          - "--exclude=node_modules" # ну тут само за себя говорит все, не переносим node_modules
      become: false

    # 4. Установка npm зависимостей от имени пользователя приложения
    - name: Install npm dependencies
      # community.general — это официальная коллекция модулей, которую развивает и поддерживает глобальное сообщество Ansible, 
      # в отличие от базового ядра ansible.builtin
      community.general.npm:
        path: "{{ app_dir }}"
        state: present
      become: true
      become_user: "{{ app_user }}"
      notify: Restart Node Service

    # 5. Рендеринг и установка systemd unit файла
    - name: Template and install systemd service unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../conf/devopsimsya-js.service.j2"
        dest: /etc/systemd/system/devopsimsya-js.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart Node Service

    # 6. Настройка NGINX
    - name: Copy NGINX configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../conf/devopsimsya-js.nginx"
        dest: /etc/nginx/sites-available/devopsimsya-js
        owner: root
        group: root
        mode: '0644'
      notify: Reload NGINX

    - name: Enable NGINX site via symlink
      ansible.builtin.file:
        src: /etc/nginx/sites-available/devopsimsya-js
        dest: /etc/nginx/sites-enabled/devopsimsya-js
        state: link
      notify: Reload NGINX

    # 7. Гарантируем запуск службы приложения
    - name: Ensure Node.js app is enabled and running
      ansible.builtin.systemd:
        name: devopsimsya-js
        state: started
        enabled: true

  handlers:
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Node Service
      ansible.builtin.systemd:
        name: devopsimsya-js
        state: restarted

    - name: Reload NGINX
      ansible.builtin.systemd:
        name: nginx
        state: reloaded